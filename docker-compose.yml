version: '3.8'

services:
  # 1. Web App & REST API (FastAPI + React Frontend)
  web:
    build: .
    container_name: slidetranslate_web
    restart: always
    ports:
      - "80:8000"
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./uploads:/app/uploads
      - ./exports:/app/exports
      - ./backend/fonts:/app/backend/fonts

  # 2. Telegram Bot Worker
  bot:
    build: .
    container_name: slidetranslate_bot
    restart: always
    command: python -u bot.py
    env_file:
      - .env
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./uploads:/app/uploads
      - ./exports:/app/exports
      - ./backend/fonts:/app/backend/fonts
    depends_on:
      - web
